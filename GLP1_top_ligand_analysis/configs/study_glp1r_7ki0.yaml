study_name: glp1r_7ki0_native_reference
screening_artifact_prefix: glp1r_7ki0_native_reference

# Sensitivity check for the choice of active-state reference complex.
# The headline GLP-1R native peptide-contact reference is built from 6X18.
# This configuration rebuilds the same reference from 7KI0, an independent
# cryo-EM structure of the active, peptide-bound GLP-1R:Gs complex
# (receptor chain R, 29-residue peptide agonist chain P), holding every other
# setting fixed. 7LCJ cannot serve the same role: it is bound to a
# small-molecule agonist (ligand UK4), not to a peptide, so it carries no
# peptide-contact reference to extract.

paths:
  screening_csv: ../results/screening_full_1M_topological_hashed.csv
  pilot_csv: ../results/screening_full_1M_topological_hashed.csv
  outputs_dir: derived_glp1r_7ki0
  reports_dir: derived_glp1r_7ki0/reports
  references_dir: references

ligands:
  id_column: zinc_id
  smiles_column: smiles
  assay_ph: 7.4
  max_tautomers_per_microstate: 8
  max_microstates_per_ligand: 2
  embed_conformers: 4
  pains_filter: false

pocket:
  reference_structure: references/7KI0.pdb
  reference_state: active
  receptor_chain: R
  ligand_chain: P
  contact_cutoff_angstrom: 4.5
  water_cutoff_angstrom: 3.5
  docking_box_padding_angstrom: 6.0
  max_pose_center_distance_angstrom: 10.0
  min_pose_residue_contacts: 3

structures:
- structure_id: 7KI0
  label: experimental_active_peptide_bound
  state: active
  pdb_path: references/7KI0.pdb
  receptor_chain: R
  ligand_chain: P
  source: rcsb
  primary: true

docking:
  engine: vina
  exhaustiveness: 24
  num_modes: 20
  seeds:
  - 11
  - 29
  - 47
  pose_score_field: affinity_kcal_mol
  bootstrap_iterations: 3000
  shortlist_sizes:
    review: 100
    md: 100
    rigorous_fe: 20
  max_shortlist_per_scaffold: 8

simulation:
  forcefield_protein: ff14SB
  forcefield_lipid: Lipid17
  forcefield_water: TIP3P
  ligand_forcefield: GAFF2_AM1_BCC
  membrane: POPC
  salt_molar: 0.15
  restrained_relaxation_ns: 5
  production_short_ns: 20
  production_long_ns: 100
  long_md_replica_count: 3
